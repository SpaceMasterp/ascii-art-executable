name: Python tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
jobs:
  unit:
    name: Fast pure-Python checks (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pytest
        run: python -m pip install pytest==9.2.0
      - name: Test pure-Python modules
        run: >-
          python -m pytest -q
          tests/test_shapes.py
          tests/test_shape_metrics.py
          tests/test_procutil.py
          tests/test_layout.py
          tests/test_app.py
          tests/test_pipeline.py
          tests/test_verification_cli.py
  full:
    name: Full checks (ubuntu, clang + node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Require the libclang native library
        run: python -c "import clang.cindex; print('libclang native library loaded')"
      - name: Record compiler and environment
        run: |
          clang --version
          python -m codeart.environment
      - name: Check browser script
        run: node --check codeart/web/app.js
      - name: Check collected test count against base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_test_count.py
      - name: Test
        run: python -m pytest -q
  full-macos:
    name: Full checks (macOS, manual or macos-ci label)
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'macos-ci'))
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Record compiler and environment
        run: |
          clang --version
          python -m codeart.environment
      - name: Check browser script
        run: node --check codeart/web/app.js
      - name: Check collected test count against base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_test_count.py
      - name: Test
        run: python -m pytest -q
