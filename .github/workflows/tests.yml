name: Python tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
jobs:
  unit:
    name: Fast pure-Python checks (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pytest
        run: python -m pip install pytest==9.2.0
      - name: Test pure-Python modules
        run: >-
          python -m pytest -q
          tests/test_shapes.py
          tests/test_shape_metrics.py
          tests/test_procutil.py
          tests/test_layout.py
          tests/test_app.py
          tests/test_pipeline.py
          tests/test_verification_cli.py
  full:
    name: Full checks (macOS, clang + node)
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Record compiler and environment
        run: |
          clang --version
          python -m codeart.environment
      - name: Check browser script
        run: node --check codeart/web/app.js
      - name: Check collected test count against base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_test_count.py
      - name: Test
        run: python -m pytest -q
